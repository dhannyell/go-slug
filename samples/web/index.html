<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>go-slug samples</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f4ee; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #status {
    position: fixed; left: 8px; bottom: 8px;
    color: #444; font: 13px sans-serif;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status"></div>
<script>
const status = document.getElementById("status");

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error("cannot load " + src));
    document.head.appendChild(el);
  });
}

if (!navigator.gpu) {
  status.textContent = "This page needs a browser with WebGPU.";
} else {
  // The runtime and the binary come from one Go toolchain.
  loadScript("wasm_exec.js").then(() => {
    const go = new Go();
    return WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject).then((result) => {
      // The js backend of the webgpu module reads linear memory through this
      // global when it writes buffers and textures.
      window.wasm = result;
      go.run(result.instance);
    });
  }).catch((err) => { status.textContent = err.message; });
}
</script>
</body>
</html>
