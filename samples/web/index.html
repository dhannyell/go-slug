<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>go-slug samples</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f4ee; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #status {
    position: fixed; left: 8px; bottom: 8px; padding: 0 4px;
    background: #f6f4eecc; color: #444; font: 13px sans-serif;
  }
  nav {
    position: fixed; right: 8px; bottom: 8px; padding: 4px 8px;
    background: #f6f4eecc; font: 13px sans-serif;
  }
  nav a { margin-left: 8px; color: #9e2133; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status"></div>
<nav>
  <a href="?scene=overview">overview</a>
  <a href="?scene=zoom">zoom</a>
  <a href="?scene=perspective">perspective</a>
  <a href="?scene=text">text</a>
  <a href="?scene=hall">hall</a>
  <a href="?scene=dive">dive</a>
  <a href="?scene=news">news</a>
  <a id="debug" href="?mode=debug">debug</a>
  <a id="compare" href="?mode=compare">compare</a>
  <a id="versus" href="?mode=versus">versus</a>
  <a id="versus-sdf" href="?mode=versus-sdf">versus sdf</a>
</nav>
<script>
const status = document.getElementById("status");

// The views keep the current scene.
const scene = new URLSearchParams(location.search).get("scene") || "overview";
for (const mode of ["debug", "compare", "versus", "versus-sdf"]) {
  document.getElementById(mode).href = "?scene=" + scene + "&mode=" + mode;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error("cannot load " + src));
    document.head.appendChild(el);
  });
}

if (!navigator.gpu) {
  status.textContent = "This page needs a browser with WebGPU.";
} else {
  // The runtime and the binary come from one Go toolchain.
  loadScript("wasm_exec.js").then(() => {
    const go = new Go();
    return WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject).then((result) => {
      // The js backend of the webgpu module reads linear memory through this
      // global when it writes buffers and textures.
      window.wasm = result;
      go.run(result.instance);
    });
  }).catch((err) => { status.textContent = err.message; });
}
</script>
</body>
</html>
